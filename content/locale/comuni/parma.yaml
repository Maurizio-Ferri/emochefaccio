livello: comune
id: parma
nome: Parma
regione: emilia-romagna
override:
  - voce: tributo-rifiuti
    ente: Iren Ambiente (gestore del servizio)
    nota_locale: >
      A Parma si paga la tariffa corrispettiva puntuale (TCP), fatturata da Iren Ambiente.
      Una parte della bolletta dipende da quante volte viene svuotato il contenitore
      del rifiuto residuo. Per attivare una nuova utenza, chiuderla o subentrare
      ti rivolgi a Iren: numero verde o sportello Iren a Parma.
    fonti:
      - titolo: Comune di Parma – Tariffazione puntuale
        url: https://www.comune.parma.it/it/argomenti/ambiente/ambiente-agenti-fisici-ed-economia-circolare/rifiuti/tariffazione-puntuale
      - titolo: Comune di Parma – Avviso agevolazione TARI/TCP 2025 (fattura di Iren Ambiente)
        url: https://www.comune.parma.it/it/amministrazione/documenti-e-dati/bandi-e-avvisi/avvisi-pubblici/avviso-agevolazione-tari-tcp-2025
      - titolo: Gruppo Iren – La TARI/TCP per il tuo Comune (Parma)
        url: https://www.gruppoiren.it/it/i-nostri-servizi/ambiente/tributi-e-tariffe/la-tari-tcp-per-il-tuo-comune.Parma.Parma.html
    verificato_il: null
  - voce: residenza-anagrafica
    ente: Comune di Parma (servizi demografici)
    nota_locale: >
      A Parma il cambio di residenza si chiede solo con il servizio online del Comune,
      entrando con SPID, CIE o CNS. Può farlo per te un delegato che ha queste credenziali.
      Se ti serve aiuto, puoi prendere un appuntamento allo sportello del Comune:
      ti aiutano a compilare la domanda online, ma devi avere comunque SPID, CIE o CNS.
    fonti:
      - titolo: Comune di Parma – Cambio di residenza
        url: https://www.comune.parma.it/it/servizi/anagrafe-stato-civile-ed-elettorale/cambio-di-residenza-1
    verificato_il: null
  - voce: imu-abitazione-principale
    ente: Comune di Parma (Sportello Entrate)
    nota_locale: >
      Se la tua abitazione principale è di lusso e quindi paghi l'IMU, l'aliquota la trovi
      nella delibera del Comune pubblicata sul sito del Dipartimento delle Finanze.
      Per dubbi puoi rivolgerti allo Sportello Entrate del Comune.
    fonti:
      - titolo: Comune di Parma – Sportello Entrate
        url: https://www.comune.parma.it/it/amministrazione/enti-e-fondazioni-1/sportello-entrate-del-comune-di-parma
      - titolo: MEF – IMU, regolamenti e aliquote (ricerca per comune)
        url: https://www.finanze.gov.it/it/fiscalita/fiscalita-regionale-e-locale/Imposta-municipale-propria-IMU/Regolamenti-e-aliquote-ricerca/
    verificato_il: null
  - voce: imu-altri-immobili
    ente: Comune di Parma (Sportello Entrate)
    nota_locale: >
      Le aliquote di Parma sono nella delibera del Comune pubblicata sul sito del Dipartimento delle Finanze.
      Il Comune prevede aliquote agevolate, per esempio per le case affittate a canone concordato
      o date in comodato a un parente stretto. Per averle devi presentare una dichiarazione
      online con SPID e ripresentarla quando la situazione cambia.
    fonti:
      - titolo: Comune di Parma – Dichiarazione IMU per particolari agevolazioni comunali
        url: https://www.comune.parma.it/it/servizi/tributi-finanze-e-contravvenzioni/dichiarazione-imu-per-lapplicazione-di-particolari-agevolazioni-comunali
      - titolo: MEF – IMU, regolamenti e aliquote (ricerca per comune)
        url: https://www.finanze.gov.it/it/fiscalita/fiscalita-regionale-e-locale/Imposta-municipale-propria-IMU/Regolamenti-e-aliquote-ricerca/
    verificato_il: null
