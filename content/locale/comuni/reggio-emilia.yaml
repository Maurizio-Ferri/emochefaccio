livello: comune
id: reggio-emilia
nome: Reggio Emilia
regione: emilia-romagna
override:
  - voce: tributo-rifiuti
    ente: Iren Ambiente (gestore del servizio)
    nota_locale: >
      Qui non si paga la TARI ma la Tariffa Corrispettiva Puntuale (TCP),
      calcolata anche in base a quante volte svuoti il contenitore dell'indifferenziato.
      Raccolta e tariffa le gestisce Iren Ambiente, che ti manda la fattura.
      L'inizio, la variazione e la fine dell'occupazione li comunichi a Iren Ambiente,
      con i moduli che trovi sul suo sito.
      Quando lasci la casa devi restituire il contenitore dell'indifferenziato, altrimenti ti addebitano delle spese.
    fonti:
      - titolo: Comune di Reggio Emilia – Tariffa Corrispettiva Puntuale (TCP)
        url: https://www.comune.reggioemilia.it/servizi/tributi-e-pagamenti/tariffa-corrispettiva-puntuale
      - titolo: Iren – La TARI/TCP per il tuo comune (Reggio Emilia)
        url: https://www.gruppoiren.it/it/i-nostri-servizi/ambiente/tributi-e-tariffe/la-tari-tcp-per-il-tuo-comune.Reggio-Emilia.Reggio-Emilia.html
    verificato_il: null
  - voce: residenza-anagrafica
    ente: Comune di Reggio Emilia (Anagrafe, Ufficio Residenze)
    nota_locale: >
      A Reggio Emilia puoi fare il cambio di residenza online dal portale ANPR.
      In alternativa invii il modulo ministeriale firmato all'Ufficio Residenze per email, PEC o raccomandata.
      Non puoi consegnarlo di persona allo sportello.
      Nel modulo indica a che titolo occupi la casa (proprietà, affitto, comodato o ospitalità):
      senza questi dati la domanda non viene accettata.
      La tariffa rifiuti non si aggiorna da sola: va dichiarata a parte a Iren.
    fonti:
      - titolo: Comune di Reggio Emilia – Dichiarazione di cambio di residenza o di indirizzo
        url: https://www.comune.reggioemilia.it/servizi/anagrafe-e-stato-civile/dichiarazione-di-cambio-di-residenza-o-di-indirizzo
      - titolo: Comune di Reggio Emilia – Anagrafe, Ufficio Residenze
        url: https://www.comune.reggioemilia.it/amministrazione/uffici/anagrafe-ufficio-residenze
    verificato_il: null
  - voce: imu-abitazione-principale
    ente: Comune di Reggio Emilia (Ufficio IMU)
    nota_locale: >
      A Reggio Emilia vale la regola nazionale. Il Comune considera come abitazione principale anche
      la casa di un anziano o di un disabile ricoverato in modo permanente, se non è affittata.
      In questo caso, per avere l'esenzione, devi presentare la dichiarazione IMU.
    fonti:
      - titolo: Comune di Reggio Emilia – IMU, chi deve e chi non deve pagarla
        url: https://www.comune.reggioemilia.it/argomenti/imu/tutte-le-informazioni-imu/imu-chi-deve-e-chi-non-deve-pagarla
      - titolo: Comune di Reggio Emilia – IMU, aliquote e detrazioni, esclusioni ed esenzioni
        url: https://www.comune.reggioemilia.it/argomenti/imu/tutte-le-informazioni-imu/imu-aliquote-e-detrazioni-esclusioni-ed-esenzioni
    verificato_il: null
  - voce: imu-altri-immobili
    ente: Comune di Reggio Emilia (Ufficio IMU)
    nota_locale: >
      A Reggio Emilia le aliquote le approva ogni anno il Consiglio comunale.
      Ci sono aliquote ridotte, ad esempio per le case affittate a canone concordato
      o date in comodato gratuito a genitori o figli che ci abitano.
      Per il comodato devi presentare la dichiarazione IMU.
      Sul sito del Comune trovi anche un calcolatore dell'IMU.
    fonti:
      - titolo: Comune di Reggio Emilia – IMU, aliquote e detrazioni, esclusioni ed esenzioni
        url: https://www.comune.reggioemilia.it/argomenti/imu/tutte-le-informazioni-imu/imu-aliquote-e-detrazioni-esclusioni-ed-esenzioni
      - titolo: Comune di Reggio Emilia – IMU
        url: https://www.comune.reggioemilia.it/argomenti/imu
    verificato_il: null
