id: bonus-nuovi-nati
titolo: Bonus nuovi nati
tipo: diritto
descrizione: >
  Per ogni figlio nato o adottato puoi chiedere all'INPS un bonus una tantum, se l'ISEE del bambino
  rientra nel limite. La domanda va fatta entro un termine dalla nascita: dopo il diritto si perde.
passi:
  - "Fai l'ISEE con il bambino incluso: il bonus spetta solo se l'ISEE rientra nel limite."
  - Fai la domanda all'INPS online con il servizio "Bonus nuovi nati", tramite il Contact Center o un patronato.
  - Fai una domanda per ogni figlio, anche in caso di gemelli.
  - Se adotti o hai un affido preadottivo, il termine parte dal giorno in cui il bambino entra in famiglia.
  - "Non aspettare: dopo il termine il diritto si perde."
ente: INPS
livello_territoriale: nazionale
