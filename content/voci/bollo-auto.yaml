id: bollo-auto
titolo: Bollo auto e moto
tipo: dovere
descrizione: >
  Se un'auto o una moto è intestata a te al PRA, paghi ogni anno la tassa automobilistica alla Regione
  dove risiedi, anche se il veicolo resta fermo. Per i ciclomotori si paga solo se li usi su strada.
  Scadenze ed esenzioni dipendono dalla Regione. Per il 2027 un decreto nazionale esenta alcune auto e
  moto, una sola per persona: controlla se la tua rientra, perché la norma può ancora cambiare.
ente: Regione di residenza
livello_territoriale: regionale
quando: [possiede_veicolo]
fonti:
