    url: https://aci.gov.it/pratica-auto/vendita-di-un-veicolo-consigli-e-cautele/
  - titolo: ACI – Passaggio di proprietà a tutela del venditore
    url: https://aci.gov.it/pratica-auto/passaggio-di-proprieta-a-tutela-del-venditore/
