id: cedolare-secca
titolo: Cedolare secca sugli affitti
tipo: diritto
descrizione: >
  Se affitti una casa come privato puoi scegliere la cedolare secca: paghi un'imposta calcolata
  sull'affitto con un'aliquota fissa, al posto di IRPEF e addizionali, e sul contratto non paghi
  imposta di registro e bollo. In cambio rinunci ad aumentare il canone, anche per l'inflazione. Prima
  devi avvisare l'inquilino con una raccomandata.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
