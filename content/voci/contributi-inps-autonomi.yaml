id: contributi-inps-autonomi
titolo: Contributi previdenziali per chi lavora in proprio
tipo: dovere
descrizione: >
  Con la partita IVA devi versare i contributi per la pensione. I professionisti senza una cassa propria
  si iscrivono online alla Gestione separata INPS; artigiani e commercianti si iscrivono alla loro gestione
  INPS con la Comunicazione Unica. I professionisti con albo e cassa versano alla propria cassa.
ente: INPS o cassa professionale
livello_territoriale: nazionale
