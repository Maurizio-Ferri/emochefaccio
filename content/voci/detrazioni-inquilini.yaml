id: detrazioni-inquilini
titolo: Detrazioni per chi è in affitto
tipo: diritto
descrizione: >
  Se vivi in affitto nella tua abitazione principale puoi avere una detrazione nella dichiarazione dei
  redditi. Spetta solo se il tuo reddito non supera certi limiti, e più il reddito è basso più la
  detrazione è alta. Ci sono regole diverse per i contratti a canone concordato, per i giovani e per
  chi si trasferisce per lavoro. Le detrazioni non si sommano: scegli quella più conveniente.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
quando: [occupa_immobile, in_affitto]
fonti:
