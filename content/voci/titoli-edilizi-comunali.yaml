id: titoli-edilizi-comunali
titolo: Pratiche edilizie al Comune
tipo: dovere
descrizione: >
  Molti lavori in casa richiedono una pratica allo Sportello unico per l'edilizia del Comune: CILA
  firmata da un tecnico, SCIA o permesso di costruire, a seconda dell'intervento. Alcuni lavori sono
  in edilizia libera e non richiedono pratiche, ma vanno rispettate le altre regole, ad esempio su
  sismica e paesaggio. Le Regioni possono cambiare in parte queste regole.
ente: Comune (Sportello unico per l'edilizia)
livello_territoriale: comunale
