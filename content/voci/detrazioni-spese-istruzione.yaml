id: detrazioni-spese-istruzione
titolo: Detrarre le spese per scuola e università
tipo: diritto
descrizione: >
  Le spese per frequentare la scuola, dall'infanzia alle superiori, e l'università si possono detrarre
  nella dichiarazione dei redditi, entro dei limiti, anche per i figli a carico. Vanno pagate con mezzi
  tracciabili, come bonifico o carta, altrimenti la detrazione non spetta.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
