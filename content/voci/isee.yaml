id: isee
titolo: ISEE, per le prestazioni agevolate
tipo: diritto
descrizione: >
  L'ISEE misura la situazione economica della famiglia e serve per chiedere prestazioni agevolate,
  come l'assegno unico per i figli. Lo ottieni presentando la DSU all'INPS, anche precompilata online,
  o tramite un CAF. Vale per un periodo limitato e va rinnovato.
