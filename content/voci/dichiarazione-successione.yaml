id: dichiarazione-successione
titolo: Dichiarazione di successione
tipo: dovere
descrizione: >
  Gli eredi devono presentare la dichiarazione di successione all'Agenzia delle Entrate entro un termine
  dal decesso, online anche in versione precompilata o tramite CAF e professionisti; basta una dichiarazione
  per tutti. Aggiorna anche il catasto degli immobili. Le imposte si calcolano e si pagano da sé.
  È esonerato solo chi rientra insieme in tutte le condizioni previste.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
