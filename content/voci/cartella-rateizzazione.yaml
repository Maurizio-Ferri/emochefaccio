id: cartella-rateizzazione
titolo: Cartella di pagamento e rateizzazione
tipo: diritto
descrizione: >
  La cartella arriva da Agenzia delle entrate-Riscossione. Puoi pagarla, chiedere di rateizzarla
  (sotto una certa cifra basta una richiesta online), chiedere la sospensione se è già pagata o prescritta,
  oppure fare ricorso contro l'ente creditore. Se non fai nulla possono seguire fermo dell'auto,
  ipoteca o pignoramento.
ente: Agenzia delle entrate-Riscossione
livello_territoriale: nazionale
fonti:
