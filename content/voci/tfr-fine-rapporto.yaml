id: tfr-fine-rapporto
titolo: TFR alla fine del rapporto di lavoro
tipo: diritto
descrizione: >
  Quando il rapporto di lavoro finisce il datore deve pagarti il TFR. Se è fallito, o se hai provato
  senza successo a farti pagare per vie legali, puoi chiedere l'intervento del Fondo di garanzia
  dell'INPS, con una domanda online.
passi:
  - Nell'ultima busta paga, o nel prospetto di liquidazione, controlla quanto TFR ti spetta e quante tasse ti hanno trattenuto.
  - "Se il TFR andava a un fondo pensione, quella parte non te la paga il datore: resta nel fondo, dove puoi lasciarla, trasferirla o, in alcuni casi, riscattarla."
  - Se il datore non paga, chiedilo per iscritto e fatti aiutare da un sindacato, un patronato o l'Ispettorato del lavoro.
  - Se il datore è fallito o in una procedura simile, chiedi l'intervento del Fondo di garanzia dell'INPS con la domanda online, da solo, tramite patronato o tramite avvocato.
  - "Non lasciar passare troppo tempo: anche il diritto al TFR si prescrive."
ente: INPS
livello_territoriale: nazionale
