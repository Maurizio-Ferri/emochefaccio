id: credito-imposta-riacquisto-prima-casa
titolo: Vendere la prima casa senza perdere le agevolazioni
tipo: diritto
descrizione: >
  Se vendi la casa comprata con le agevolazioni prima casa e ne ricompri un'altra entro un termine,
  hai un credito d'imposta pari all'imposta di registro o all'IVA pagata sul primo acquisto, che però
  non può superare l'imposta dovuta sul nuovo. Se invece la vendi troppo presto senza ricomprare,
  perdi le agevolazioni e paghi le imposte risparmiate, gli interessi e una sanzione.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
