id: pensione-reversibilita
titolo: Pensione ai superstiti (reversibilità)
tipo: diritto
descrizione: >
  Quando muore un pensionato, o un lavoratore con abbastanza contributi, il coniuge o l'unito civilmente
  e i figli a carico possono chiedere all'INPS la pensione ai superstiti; in mancanza, a certe condizioni,
  anche genitori o fratelli. La domanda si fa online o tramite patronato.
ente: INPS
livello_territoriale: nazionale
