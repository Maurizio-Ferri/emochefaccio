id: pensione-reversibilita
titolo: Pensione ai superstiti (reversibilità)
tipo: diritto
descrizione: >
  Quando muore un pensionato, o un lavoratore con abbastanza contributi, possono chiedere all'INPS la
  pensione ai superstiti il coniuge o l'unito civilmente, anche separato o, a certe condizioni,
  divorziato, e i figli minorenni, studenti o inabili; in mancanza, a certe condizioni, anche genitori
  o fratelli. La domanda si fa online, al contact center o tramite patronato.
ente: INPS
livello_territoriale: nazionale
