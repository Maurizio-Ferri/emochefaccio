id: scelta-destinazione-tfr
titolo: Scegliere dove va il tuo TFR
tipo: diritto
descrizione: >
  Se lavori come dipendente nel settore privato, entro un termine dall'assunzione scegli se lasciare il TFR
  in azienda o destinarlo a un fondo pensione. Per chi è assunto dal 1° luglio 2026, se non rinunci
  il TFR va automaticamente al fondo previsto dal tuo contratto; la scelta si può poi rivedere.
ente: Ministero del Lavoro / COVIP
livello_territoriale: nazionale
