id: demolizione-veicolo
titolo: Rottamare un veicolo
tipo: dovere
descrizione: >
  Per rottamare un veicolo devi consegnarlo a un centro di raccolta autorizzato o a un concessionario,
  che ti dà il certificato di rottamazione: conservalo. Dopo la cancellazione dal PRA non paghi più il bollo.
  Se sul veicolo c'è un fermo amministrativo servono documenti in più.
ente: ACI (PRA)
livello_territoriale: nazionale
