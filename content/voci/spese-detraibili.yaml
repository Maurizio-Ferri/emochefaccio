id: spese-detraibili
titolo: Conservare le spese detraibili
tipo: diritto
descrizione: >
  Alcune spese (sanitarie, di istruzione, per l'affitto e altre) riducono le tasse
  da pagare. Spesso devono essere pagate con mezzi tracciabili: conserva ricevute e documenti.
