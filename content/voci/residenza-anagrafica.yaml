id: residenza-anagrafica
titolo: Trasferire la residenza
tipo: dovere
descrizione: >
  Se vai a vivere stabilmente in un'altra casa devi dichiarare il cambio di residenza al Comune,
  anche online dal portale ANPR con SPID, CIE o CNS. Il Comune poi fa un accertamento.
  Alcune agevolazioni, come quelle per la prima casa, possono richiederlo entro un termine.
  Patente e libretto si aggiornano tramite il Comune, senza più l'adesivo.
passi:
  - "Quando vai ad abitare nella nuova casa, tieni pronti i dati catastali dell'immobile: se è tuo, li trovi nell'atto di acquisto."
  - "Entra nel portale dell'Anagrafe nazionale (ANPR) con SPID, CIE o CNS e scegli \"Cambio di residenza\", oppure usa il servizio del tuo Comune: canali e sportelli cambiano da comune a comune."
  - "Indica chi si trasferisce con te: gli altri maggiorenni devono confermare dalla loro area riservata."
  - Il Comune registra subito la dichiarazione e poi fa un accertamento. Se è positivo, la residenza vale dal giorno in cui l'hai presentata.
  - "Segui la pratica online: ti arrivano avvisi per email e sull'app IO."
  - Patente e libretto dell'auto si aggiornano tramite il Comune.
ente: Comune (anagrafe)
livello_territoriale: comunale
quando: [occupa_immobile]
fonti:
