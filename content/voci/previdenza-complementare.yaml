id: previdenza-complementare
titolo: Fondo pensione e deduzione dei contributi
tipo: diritto
descrizione: >
  Oltre al TFR puoi versare contributi tuoi a un fondo pensione, anche per i familiari a carico:
  li deduci dal reddito entro un limite annuo, che dal 2026 è più alto. I contributi che non hai dedotto
  vanno comunicati al fondo entro un termine, altrimenti saranno tassati quando li riceverai.
ente: COVIP / Agenzia delle Entrate
livello_territoriale: nazionale
fonti:
