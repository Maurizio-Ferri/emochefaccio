id: detrazioni-familiari-carico
titolo: Detrazioni per familiari a carico in busta paga
tipo: diritto
descrizione: >
  Le detrazioni per lavoro dipendente le applica il datore da solo. Per avere in busta paga quelle per
  i familiari a carico devi invece dichiarargli di averne diritto, e poi comunicare le variazioni:
  se non lo fai rischi una sanzione. Per i figli più piccoli al posto della detrazione c'è l'assegno unico.
ente: Agenzia delle Entrate (tramite il datore di lavoro)
livello_territoriale: nazionale
fonti:
  - titolo: Normattiva – DPR 600/1973, art. 23
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.del.presidente.della.repubblica:1973-09-29;600~art23
  - titolo: Agenzia delle Entrate – Istruzioni modello 730/2026
    url: https://infoprecompilata.agenziaentrate.gov.it/portale/documents/d/guest/730_istruzioni_2026.pdf
verificato_il: null
maturita: bozza
