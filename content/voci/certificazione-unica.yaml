id: certificazione-unica
titolo: Certificazione Unica dal datore di lavoro
tipo: diritto
descrizione: >
  Ogni anno il datore di lavoro deve consegnarti la Certificazione Unica, con quanto ti ha pagato
  e le tasse che ha trattenuto. Controllala: i suoi dati entrano nella dichiarazione precompilata
  e la trovi anche nel cassetto fiscale.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
quando: [lavoratore_dipendente]
