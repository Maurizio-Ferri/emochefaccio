id: scelta-medico
titolo: Scegliere il medico di base o il pediatra
tipo: diritto
descrizione: >
  Ogni iscritto al Servizio sanitario nazionale sceglie un medico di base, o un pediatra per i bambini,
  tra quelli della ASL della zona in cui vive, e può cambiarlo quando vuole. Se ti trasferisci in un'altra
  zona devi sceglierne uno nuovo. Come si fa, anche online, dipende dalla Regione.
passi:
  - Aspetta che arrivino il codice fiscale e la prima tessera sanitaria del bambino.
  - Iscrivi il bambino al Servizio sanitario nella tua ASL e scegli un pediatra tra quelli della tua zona, allo sportello o online se la tua Regione lo consente.
  - Dopo l'iscrizione ricevi a casa una nuova tessera sanitaria.
  - Puoi cambiare pediatra o medico quando vuoi; se ti trasferisci in un'altra zona devi sceglierne uno nuovo.
  - "Quando il bambino cresce passa al medico di base: l'ASL ti dice quando."
ente: ASL
livello_territoriale: regionale
fonti:
  - titolo: Normattiva – Legge 833/1978, art. 25
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1978-12-23;833~art25
  - titolo: Agenzia delle Entrate – La tessera sanitaria per i neonati
