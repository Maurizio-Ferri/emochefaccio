id: apertura-partita-iva
titolo: Aprire la partita IVA
tipo: dovere
descrizione: >
  Se inizi a lavorare in proprio in modo abituale devi aprire la partita IVA entro un termine dall'inizio.
  I professionisti presentano il modello AA9/12 all'Agenzia delle Entrate, anche online e gratis con SPID o CIE.
  Chi avvia un'impresa, ad esempio artigiani e commercianti, la chiede con la Comunicazione Unica
  alla Camera di Commercio.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
