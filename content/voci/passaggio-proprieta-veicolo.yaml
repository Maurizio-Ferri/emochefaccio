id: passaggio-proprieta-veicolo
titolo: Intestare a te il veicolo che compri
tipo: dovere
descrizione: >
  Se compri un veicolo usato devi chiedere il Documento Unico a tuo nome entro un termine dall'autentica
  della firma del venditore, presso uno sportello STA (ACI-PRA, Motorizzazione o agenzia di pratiche auto).
  Senza trascrizione rischi sanzioni e il ritiro del documento. Per un veicolo nuovo di solito
  se ne occupa il concessionario.
ente: ACI (PRA) e Motorizzazione civile
livello_territoriale: nazionale
