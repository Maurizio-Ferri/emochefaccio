id: carta-identita
titolo: Rinnovare la carta d'identità
tipo: dovere
descrizione: >
  La carta d'identità elettronica si chiede al Comune, prenotando anche online con l'Agenda CIE, e si
  può rinnovare già prima della scadenza. Dal 3 agosto 2026 la vecchia carta di carta non vale più per
  andare all'estero e in Italia vale solo per alcuni usi e per poco tempo ancora: conviene
  sostituirla. Se la chiedi dopo una certa età la nuova carta non ha scadenza, ma per continuare a
  usarla per i servizi online dopo alcuni anni devi comunque rifarla.
ente: Comune (rilascio) / Ministero dell'Interno
livello_territoriale: nazionale
