id: imu-abitazione-principale
titolo: Esenzione IMU per l'abitazione principale
tipo: diritto
descrizione: >
  Sulla casa in cui hai residenza e dimora abituale di norma non paghi l'IMU,
  salvo le abitazioni di lusso. Sulle altre case di proprietà l'IMU è dovuta al Comune.
ente: Comune
livello_territoriale: comunale
