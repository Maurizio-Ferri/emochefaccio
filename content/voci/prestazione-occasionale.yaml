id: prestazione-occasionale
titolo: Lavoro autonomo occasionale
tipo: dovere
descrizione: >
  Se lavori in proprio solo ogni tanto, senza abitualità, puoi farlo senza partita IVA: rilasci una ricevuta
  e, se il committente è un'impresa, un professionista, un ente o un condominio, ti trattiene una ritenuta
  come acconto delle tasse. Il compenso va dichiarato
  nella dichiarazione dei redditi. Oltre una certa cifra all'anno devi iscriverti alla Gestione separata INPS
  e avvisare i committenti.
ente: Agenzia delle Entrate / INPS
livello_territoriale: nazionale
