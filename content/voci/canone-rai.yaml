id: canone-rai
titolo: Canone TV
tipo: dovere
descrizione: >
  Se in casa hai un televisore paghi il canone, una volta per famiglia, di solito a rate nella
  bolletta della luce. Se hai il contratto della luce di casa ma non hai la TV, devi dichiararlo ogni
  anno all'Agenzia delle Entrate, altrimenti il canone ti viene addebitato. Alcune persone, ad esempio
  gli anziani con reddito basso, ne sono esenti.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
quando: [occupa_immobile]
