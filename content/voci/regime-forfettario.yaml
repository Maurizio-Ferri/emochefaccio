id: regime-forfettario
titolo: Regime forfettario
tipo: diritto
descrizione: >
  Se rispetti i requisiti puoi usare il regime forfettario: paghi un'unica imposta al posto di IRPEF e
  addizionali, non addebiti l'IVA in fattura e non devi tenere le scritture contabili, ma devi
  conservare le fatture. Per le nuove attività, a certe condizioni, l'imposta è ridotta nei primi
  anni. Alcune situazioni lo escludono, ad esempio lavorare soprattutto per il tuo datore di lavoro,
  attuale o recente.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
fonti:
