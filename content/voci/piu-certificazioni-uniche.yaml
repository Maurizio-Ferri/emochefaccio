id: piu-certificazioni-uniche
titolo: Più datori di lavoro nello stesso anno
tipo: dovere
descrizione: >
  Se nello stesso anno hai avuto più datori di lavoro, consegna al nuovo la Certificazione Unica
  del precedente perché faccia il conguaglio. Se il conguaglio non c'è stato, di solito devi presentare
  la dichiarazione dei redditi.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
fonti:
