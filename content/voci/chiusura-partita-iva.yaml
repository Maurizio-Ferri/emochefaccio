id: chiusura-partita-iva
titolo: Chiudere la partita IVA
tipo: dovere
descrizione: >
  Quando smetti l'attività devi comunicare la chiusura della partita IVA entro un termine: i
  professionisti con il modello AA9/12 all'Agenzia delle Entrate, le imprese con la Comunicazione
  Unica. Se resta inattiva, l'Agenzia può chiuderla d'ufficio. Prima ti manda un avviso, che trovi
  anche nel cassetto fiscale: se l'attività continua, puoi rispondere e chiedere di non chiuderla.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
