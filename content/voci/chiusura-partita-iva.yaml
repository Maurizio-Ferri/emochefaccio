id: chiusura-partita-iva
titolo: Chiudere la partita IVA
tipo: dovere
descrizione: >
  Quando smetti l'attività devi comunicare la chiusura della partita IVA entro un termine: i professionisti
  con il modello AA9/12 all'Agenzia delle Entrate, le imprese con la Comunicazione Unica. Se resta inattiva
  l'Agenzia può chiuderla d'ufficio, dopo averti avvisato nel cassetto fiscale.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
