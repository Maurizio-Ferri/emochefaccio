id: permessi-legge-104
titolo: Permessi per assistere un familiare con disabilità
tipo: diritto
descrizione: >
  Se sei dipendente e assisti un familiare con disabilità grave, compreso il coniuge o il convivente,
  hai diritto a permessi retribuiti ogni mese e, a certe condizioni, a un congedo straordinario.
  Nel privato si chiedono all'INPS, online o tramite patronato, e vanno comunicati al datore di lavoro;
  nel pubblico si chiedono alla propria amministrazione.
ente: INPS
livello_territoriale: nazionale
