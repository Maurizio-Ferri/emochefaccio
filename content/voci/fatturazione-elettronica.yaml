id: fatturazione-elettronica
titolo: Fattura elettronica
tipo: dovere
descrizione: >
  Con la partita IVA, anche nel regime forfettario, le fatture vanno emesse in formato elettronico
  tramite il Sistema di Interscambio. L'Agenzia delle Entrate offre gratis gli strumenti per prepararle,
  inviarle e conservarle. Fanno eccezione le prestazioni sanitarie ai privati.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
