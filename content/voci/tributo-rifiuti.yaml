id: tributo-rifiuti
titolo: Dichiarare la casa per la tassa sui rifiuti
tipo: dovere
descrizione: >
  Quando inizi a occupare un immobile devi dichiararlo e pagare il prelievo sui rifiuti.
  A seconda del comune è la TARI (al Comune) o una tariffa corrispettiva (al gestore).
  Se cambia qualcosa, ad esempio quando lasci la casa, va presentata una nuova dichiarazione
  secondo il regolamento del Comune. Esistono riduzioni previste dai regolamenti comunali.
ente: Comune o gestore del servizio rifiuti
livello_territoriale: comunale
quando: [occupa_immobile]
