id: tributo-rifiuti
titolo: Dichiarare la casa per la tassa sui rifiuti
tipo: dovere
descrizione: >
  Quando inizi a occupare un immobile devi dichiararlo e pagare il prelievo sui rifiuti. A seconda del
  comune è la TARI (al Comune) o una tariffa corrispettiva (al gestore). Se cambia qualcosa, ad
  esempio quando lasci la casa, va presentata una nuova dichiarazione entro il termine di legge.
  Esistono riduzioni previste dalla legge, per esempio per il compostaggio domestico, e altre previste
  dai regolamenti comunali.
passi:
  - Sul sito del tuo Comune scopri se paghi la TARI al Comune o una tariffa al gestore dei rifiuti.
  - Presenta la dichiarazione di inizio occupazione con il modulo del Comune o del gestore, indicando dati catastali, numero civico e interno.
  - Se in casa abitate in più persone, basta la dichiarazione di una sola.
  - Se lasci un'altra casa, presenta anche la dichiarazione di cessazione per quella.
  - "Chiedi le riduzioni previste, per esempio per il compostaggio domestico: le altre le trovi nel regolamento comunale."
  - Paga gli avvisi o le fatture alle scadenze fissate dal Comune o dal gestore.
ente: Comune o gestore del servizio rifiuti
livello_territoriale: comunale
quando: [occupa_immobile]
