id: ravvedimento-operoso
titolo: Rimediare a un errore con il ravvedimento operoso
tipo: diritto
descrizione: >
  Se hai saltato o sbagliato un pagamento o una dichiarazione puoi rimediare da solo con il
  ravvedimento operoso, pagando quello che dovevi, gli interessi e una sanzione ridotta, più bassa
  quanto prima ti metti in regola. Una dichiarazione non presentata si può sistemare così solo poco
  dopo la scadenza: verifica il termine sulla fonte. Per le imposte dell'Agenzia delle Entrate non
  puoi più farlo dopo che ti è stato notificato un avviso bonario o un atto di accertamento su quella
  violazione; per gli altri tributi, come quelli del Comune, basta che sia iniziato un controllo.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
