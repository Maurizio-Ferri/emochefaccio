id: ravvedimento-operoso
titolo: Rimediare a un errore con il ravvedimento operoso
tipo: diritto
descrizione: >
  Se hai saltato o sbagliato un pagamento o una dichiarazione puoi rimediare da solo con il ravvedimento
  operoso, pagando una sanzione ridotta che è più bassa quanto prima ti metti in regola. Non puoi più farlo
  dopo che ti è arrivato un avviso bonario o un atto di accertamento su quella violazione.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
