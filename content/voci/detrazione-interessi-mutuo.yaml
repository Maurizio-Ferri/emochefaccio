id: detrazione-interessi-mutuo
titolo: Detrazione degli interessi del mutuo
tipo: diritto
descrizione: >
  Gli interessi pagati sul mutuo per l'acquisto dell'abitazione principale
  si possono detrarre in dichiarazione dei redditi, entro certi limiti.
passi:
  - "Il mutuo deve essere ipotecario e servire a comprare la casa che diventerà la tua abitazione principale: lo scopo deve risultare dal contratto."
  - "Firma mutuo e acquisto a poca distanza di tempo: la legge fissa un termine tra i due."
  - "Vai ad abitare nella casa entro il termine di legge: fanno fede la residenza oppure un'autocertificazione di dimora abituale."
  - Conserva atto di acquisto, contratto di mutuo, ricevute degli oneri accessori e le quietanze o la certificazione annuale della banca.
  - Ogni anno inserisci gli interessi nella dichiarazione dei redditi e controlla che nella precompilata ci siano.
  - Se il mutuo è intestato a due persone, ciascuno detrae la propria quota. Con redditi alti e mutui firmati di recente la detrazione può essere ridotta.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
quando: [proprietario_abitazione, ha_mutuo]
fonti:
