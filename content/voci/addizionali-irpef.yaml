id: addizionali-irpef
titolo: Addizionali regionale e comunale all'IRPEF
tipo: dovere
descrizione: >
  Oltre all'IRPEF paghi un'addizionale alla Regione e una al Comune, con aliquote decise da ciascun ente.
  Se sei dipendente te le trattiene il datore di lavoro in busta paga, a rate nell'anno successivo.
ente: Regione e Comune (disciplina MEF)
livello_territoriale: nazionale
quando: [lavoratore_dipendente]
