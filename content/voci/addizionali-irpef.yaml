id: addizionali-irpef
titolo: Addizionali regionale e comunale all'IRPEF
tipo: dovere
descrizione: >
  Se devi pagare l'IRPEF, paghi anche un'addizionale alla Regione e una al Comune. Ciascun ente decide
  le aliquote entro i limiti di legge, e il Comune può prevedere un'esenzione per i redditi bassi. Se
  sei dipendente te le trattiene il datore di lavoro in busta paga, a rate: l'addizionale regionale e
  il saldo di quella comunale nell'anno dopo, un acconto di quella comunale già nell'anno in corso.
ente: Regione e Comune (disciplina MEF)
livello_territoriale: nazionale
quando: [lavoratore_dipendente]
