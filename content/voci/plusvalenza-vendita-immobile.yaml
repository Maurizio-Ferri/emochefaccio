id: plusvalenza-vendita-immobile
titolo: Tasse sul guadagno quando vendi una casa
tipo: dovere
descrizione: >
  Se vendi un immobile poco tempo dopo averlo comprato o costruito, il guadagno (plusvalenza) può
  essere tassato. Non lo è se la casa è stata per la maggior parte del tempo l'abitazione principale
  tua o dei tuoi familiari, o se l'hai ereditata. Se l'hai ricevuta in dono, il tempo si conta da
  quando l'aveva comprata chi te l'ha donata. Se vendi un terreno edificabile il guadagno è sempre
  tassato. Per le case con lavori Superbonus le regole sono più severe.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
fonti:
