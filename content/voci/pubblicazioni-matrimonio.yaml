id: pubblicazioni-matrimonio
titolo: Pubblicazioni di matrimonio e richiesta di unione civile
tipo: dovere
descrizione: >
  Prima del matrimonio, civile o religioso con effetti civili, il Comune deve fare le pubblicazioni.
  Le coppie dello stesso sesso costituiscono l'unione civile con una richiesta allo stato civile e poi
  una dichiarazione davanti all'ufficiale. Se non scegliete diversamente, il regime è la comunione dei beni.
ente: Comune (stato civile)
livello_territoriale: nazionale
