    url: https://unica.istruzione.gov.it/it/orientamento/iscrizioni
  - titolo: Ministero dell'Istruzione e del Merito – Sistema educativo di istruzione e formazione
    url: https://www.mim.gov.it/sistema-educativo-di-istruzione-e-formazione
