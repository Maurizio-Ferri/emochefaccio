id: imu-altri-immobili
titolo: IMU sugli altri immobili
tipo: dovere
descrizione: >
  Su seconde case, terreni, aree edificabili e pertinenze oltre quelle della prima casa paghi l'IMU
  al Comune dove si trova l'immobile, di solito in due rate. Le aliquote le decide il Comune.
