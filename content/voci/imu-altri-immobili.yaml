id: imu-altri-immobili
titolo: IMU sugli altri immobili
tipo: dovere
descrizione: >
  Su seconde case, terreni, aree edificabili e pertinenze oltre quelle della prima casa paghi l'IMU al
  Comune dove si trova l'immobile, in due rate oppure tutto insieme alla prima scadenza. La legge
  fissa un'aliquota di base e il Comune può alzarla o abbassarla entro certi limiti. Alcuni terreni
  agricoli sono esenti.
ente: Comune
livello_territoriale: comunale
quando: [possiede_altri_immobili]
