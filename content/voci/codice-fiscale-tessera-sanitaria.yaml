id: codice-fiscale-tessera-sanitaria
titolo: Codice fiscale e tessera sanitaria
tipo: diritto
descrizione: >
  Il codice fiscale ti identifica in tutti i rapporti con lo Stato. La tessera sanitaria lo riporta
  e sul retro vale come tessera europea per le cure all'estero. Quando sta per scadere ti arriva
  una nuova tessera a casa; se la perdi puoi chiederne la riemissione online o in ufficio.
ente: Agenzia delle Entrate
