id: albo-scrutatori
titolo: Iscriversi all'albo degli scrutatori e dei presidenti di seggio
tipo: diritto
descrizione: >
  Se voti nel tuo Comune puoi chiedere di entrare nell'albo degli scrutatori, e con il diploma anche
  in quello dei presidenti di seggio, entro le date fissate ogni anno in autunno. Chi lavora al seggio
  riceve un compenso e può assentarsi dal lavoro per tutta la durata delle operazioni.
ente: Comune / Corte d'appello
livello_territoriale: nazionale
