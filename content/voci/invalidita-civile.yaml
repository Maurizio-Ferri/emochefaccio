id: invalidita-civile
titolo: Riconoscimento dell'invalidità civile e della disabilità
tipo: diritto
descrizione: >
  Per il riconoscimento dell'invalidità civile o della disabilità (legge 104) il medico invia online
  all'INPS il certificato introduttivo; poi presenti la domanda, anche tramite patronato, e fai la visita.
  Nelle province dove si sperimenta la riforma basta il certificato del medico; dal 2027 la nuova
  procedura vale in tutta Italia.
ente: INPS
livello_territoriale: nazionale
