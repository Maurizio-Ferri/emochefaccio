id: convivenza-di-fatto
titolo: Registrare la convivenza di fatto
tipo: diritto
descrizione: >
  Due persone maggiorenni che vivono insieme come coppia, senza essere sposate, unite civilmente o parenti,
  possono dichiarare la convivenza all'anagrafe del Comune. Ottengono così alcuni diritti, come assistere
  il partner in ospedale o subentrare nel contratto d'affitto. Con un notaio o un avvocato si può anche
  fare un contratto di convivenza.
ente: Comune (anagrafe)
livello_territoriale: nazionale
fonti:
  - titolo: Normattiva – Legge 76/2016 (unioni civili e convivenze)
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2016-05-20;76
verificato_il: null
maturita: bozza
