id: convivenza-di-fatto
titolo: Registrare la convivenza di fatto
tipo: diritto
descrizione: >
  Due persone maggiorenni che vivono insieme come coppia e si assistono a vicenda, senza essere
  sposate, unite civilmente, parenti, affini o legate da adozione, possono dichiarare la convivenza
  all'anagrafe del Comune: la dichiarazione serve a dimostrarla. La legge dà ai conviventi alcuni
  diritti, come assistere il partner in ospedale o subentrare nel contratto d'affitto se il partner
  muore o lo lascia. Con un notaio o un avvocato si può anche fare un contratto di convivenza.
ente: Comune (anagrafe)
livello_territoriale: nazionale
fonti:
  - titolo: Normattiva – Legge 76/2016 (unioni civili e convivenze)
