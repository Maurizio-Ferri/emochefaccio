id: assegno-unico
titolo: Assegno unico per i figli
tipo: diritto
descrizione: >
  Per ogni figlio a carico puoi chiedere all'INPS l'assegno unico, già dal settimo mese di gravidanza.
  L'importo dipende dall'ISEE: senza ISEE ricevi il minimo. Una volta fatta la domanda continua negli anni,
  ma devi comunicare le variazioni e rinnovare l'ISEE ogni anno.
passi:
  - "Dopo la nascita fai la domanda all'INPS: online con il servizio \"Assegno unico e universale\", tramite patronato o con il Contact Center."
  - "Se ricevi già l'assegno per un altro figlio non serve una nuova domanda: aggiungi il nuovo nato modificando quella che hai."
  - Se volete, chiedete di dividere il pagamento a metà tra i genitori, anche in un secondo momento.
  - "Presenta l'ISEE con il bambino incluso: l'importo dipende dall'ISEE."
  - "Negli anni seguenti l'assegno continua da solo: rinnova l'ISEE ogni anno e comunica i cambiamenti nella famiglia."
ente: INPS
livello_territoriale: nazionale
fonti:
