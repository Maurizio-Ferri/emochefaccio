id: passaporto
titolo: Richiedere o rinnovare il passaporto
tipo: dovere
descrizione: >
  Il passaporto si chiede alla Questura, prenotando online con SPID o CIE; nei piccoli Comuni che
  partecipano al progetto Polis è in prova la domanda all'ufficio postale. Ha una validità limitata, più breve per i minori.
  Per il passaporto di un figlio minorenne serve l'assenso di entrambi i genitori o, in mancanza,
  del giudice tutelare.
ente: Polizia di Stato (Questura)
livello_territoriale: nazionale
