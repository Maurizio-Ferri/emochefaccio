id: rinnovo-patente
titolo: Rinnovo della patente
tipo: dovere
descrizione: >
  La patente scade, con intervalli che cambiano con la categoria e l'età. Per rinnovarla fai una visita
  da un medico abilitato; la nuova patente ti arriva per posta. Guidare con la patente scaduta
  comporta una multa e il ritiro del documento.
ente: Ministero delle Infrastrutture e dei Trasporti
livello_territoriale: nazionale
quando: [ha_patente]
