id: bonus-edilizi
titolo: Detrazioni per ristrutturazione e risparmio energetico
tipo: diritto
descrizione: >
  Per i lavori di ristrutturazione, risparmio energetico e antisismici puoi detrarre parte della spesa
  dalle tasse, di più se si tratta dell'abitazione principale. Devi pagare con un bonifico apposito,
  che riporti causale e codici fiscali, e conservare fatture e titoli edilizi; per il risparmio energetico
  serve anche la comunicazione all'ENEA.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
