id: bonus-edilizi
titolo: Detrazioni per ristrutturazione e risparmio energetico
tipo: diritto
descrizione: >
  Per i lavori di ristrutturazione, risparmio energetico e antisismici puoi detrarre parte della spesa
  dalle tasse; oggi la detrazione è più alta per l'abitazione principale, ma la misura cambia di anno
  in anno. Devi pagare con un bonifico apposito, che riporti causale e codici fiscali, e conservare
  fatture e titoli edilizi. Per alcuni lavori devi avvisare l'ASL prima di iniziare; per il risparmio
  energetico serve anche la comunicazione all'ENEA.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
