id: naspi
titolo: NASpI, l'indennità di disoccupazione
tipo: diritto
descrizione: >
  Se eri dipendente e perdi il lavoro senza averlo scelto, e hai abbastanza contributi, puoi chiedere
  la NASpI all'INPS, online, al contact center o tramite patronato, entro un termine dalla fine del
  rapporto: dopo il diritto si perde. Se poco prima avevi lasciato per scelta un altro lavoro a tempo
  indeterminato, ci sono requisiti in più.
ente: INPS
livello_territoriale: nazionale
