id: naspi
titolo: NASpI, l'indennità di disoccupazione
tipo: diritto
descrizione: >
  Se perdi il lavoro senza averlo scelto e hai abbastanza contributi puoi chiedere la NASpI all'INPS,
  online o tramite patronato, entro un termine dalla fine del rapporto: dopo il diritto si perde.
  Se ti eri dimesso da un altro lavoro poco prima ci sono requisiti in più.
