id: congedi-genitoriali
titolo: Congedi di maternità, paternità e parentale
tipo: diritto
descrizione: >
  Se sei dipendente, la madre ha un congedo di maternità obbligatorio e il padre un congedo di paternità
  obbligatorio, da comunicare al datore di lavoro. Poi entrambi possono usare il congedo parentale facoltativo,
  chiedendolo all'INPS prima di iniziare. Le regole sono diverse per autonomi e dipendenti pubblici.
ente: INPS
livello_territoriale: nazionale
