id: quadro-rw
titolo: Conti, investimenti e case all'estero in dichiarazione
tipo: dovere
descrizione: >
  Se hai conti, investimenti o immobili all'estero, oppure cripto-attività, devi indicarli nel quadro
  RW della dichiarazione dei redditi, anche se li hai chiusi durante l'anno, e pagare le imposte sul
  loro valore (IVIE e IVAFE). Se ometti il quadro rischi sanzioni. Ci sono esoneri, ad esempio per i
  conti esteri con saldi bassi, ma se devi pagare l'IVAFE il quadro va compilato comunque. Non devi
  indicare quello che tieni presso un intermediario italiano che applica già le imposte.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
