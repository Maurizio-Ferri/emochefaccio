id: quadro-rw
titolo: Conti, investimenti e case all'estero in dichiarazione
tipo: dovere
descrizione: >
  Se hai conti, investimenti, immobili o cripto-attività all'estero devi indicarli nel quadro RW
  della dichiarazione dei redditi, anche se li hai chiusi durante l'anno, e pagare le imposte
  sul loro valore (IVIE e IVAFE). Se ometti il quadro rischi sanzioni. Ci sono esoneri, ad esempio
  per i conti esteri con saldi bassi.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
fonti:
