id: regime-amministrato
titolo: Investire senza dichiarare i guadagni (regime amministrato)
tipo: diritto
descrizione: >
  Se investi tramite una banca o un altro intermediario italiano puoi scegliere il regime amministrato:
  è l'intermediario a pagare le imposte sui guadagni e tu non devi indicarli nella dichiarazione.
  Senza questa scelta sei nel regime dichiarativo e i guadagni li dichiari tu.
ente: Agenzia delle Entrate (tramite l'intermediario)
livello_territoriale: nazionale
fonti:
  - titolo: Normattiva – D.Lgs. 461/1997, art. 6 (regime amministrato)
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1997-11-21;461~art6
  - titolo: Normattiva – D.Lgs. 461/1997, art. 5 (regime dichiarativo)
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1997-11-21;461~art5
verificato_il: null
maturita: bozza
