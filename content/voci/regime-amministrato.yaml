id: regime-amministrato
titolo: Investire senza dichiarare i guadagni (regime amministrato)
tipo: diritto
descrizione: >
  Se investi tramite una banca o un altro intermediario italiano puoi scegliere il regime
  amministrato: è l'intermediario a pagare le imposte sui guadagni e tu non devi indicarli nella
  dichiarazione. La scelta si fa quando apri il conto o, per un conto che hai già, prima dell'inizio
  dell'anno. Senza questa scelta sei nel regime dichiarativo e i guadagni li dichiari tu, ma per i
  fondi comuni l'intermediario applica comunque le imposte.
ente: Agenzia delle Entrate (tramite l'intermediario)
livello_territoriale: nazionale
