id: esenzione-ticket
titolo: Esenzione dal ticket sanitario
tipo: diritto
descrizione: >
  Puoi non pagare il ticket per reddito, per una malattia cronica, invalidante o rara, o per invalidità.
  Per patologia o invalidità l'attestato lo rilascia la ASL. Per reddito il medico verifica il diritto
  negli elenchi del Sistema Tessera Sanitaria e lo indica sulla ricetta; se non risulti, chiedi alla ASL.
  Come funziona nel dettaglio dipende dalla Regione.
ente: ASL / Sistema Tessera Sanitaria
livello_territoriale: regionale
