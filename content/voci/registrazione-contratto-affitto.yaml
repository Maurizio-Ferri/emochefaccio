id: registrazione-contratto-affitto
titolo: Registrazione del contratto d'affitto
tipo: dovere
descrizione: >
  Il contratto d'affitto va registrato all'Agenzia delle Entrate entro un termine. L'obbligo è sia
  dell'inquilino sia del proprietario, che rispondono insieme dell'imposta di registro.
  Se il proprietario sceglie la cedolare secca, l'imposta di registro non si paga.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
quando: [occupa_immobile, in_affitto]
