id: dimissioni-telematiche
titolo: Dimettersi con la procedura online
tipo: dovere
descrizione: >
  Le dimissioni da un lavoro privato valgono solo se presentate online, da solo con SPID o CIE
  oppure tramite patronato o sindacato; per un breve periodo puoi revocarle. Se ti dimetti di regola
  non hai la NASpI, salvo giusta causa. Anche le assenze ingiustificate prolungate possono essere
  considerate dimissioni.
ente: Ministero del Lavoro
livello_territoriale: nazionale
