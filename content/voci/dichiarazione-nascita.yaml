id: dichiarazione-nascita
titolo: Dichiarare la nascita
tipo: dovere
descrizione: >
  La nascita va dichiarata entro un termine, più breve se lo fai in ospedale, più lungo se vai
  al Comune dove è nato il bambino o a quello di residenza dei genitori. Con la dichiarazione il Comune
  attribuisce il codice fiscale; la prima tessera sanitaria arriva poi a casa.
ente: Comune (stato civile)
livello_territoriale: nazionale
fonti:
