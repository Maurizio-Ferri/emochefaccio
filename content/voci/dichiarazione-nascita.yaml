id: dichiarazione-nascita
titolo: Dichiarare la nascita
tipo: dovere
descrizione: >
  La nascita va dichiarata entro un termine, più breve se lo fai in ospedale, più lungo se vai
  al Comune dove è nato il bambino o a quello di residenza dei genitori. Con la dichiarazione il Comune
  attribuisce il codice fiscale; la prima tessera sanitaria arriva poi a casa.
passi:
  - "Scegli dove dichiarare la nascita: in ospedale, alla direzione sanitaria, oppure al Comune dove è nato il bambino o a quello dove risiedete. In ospedale il termine è più breve."
  - Porta l'attestazione di nascita rilasciata dall'ospedale o dall'ostetrica.
  - Se i genitori vivono in Comuni diversi, salvo accordo tra loro si dichiara nel Comune della madre.
  - "Se non siete sposati, il padre può riconoscere il figlio nello stesso momento: chiedi prima all'ufficio cosa serve."
  - Con la dichiarazione il bambino riceve il codice fiscale; la prima tessera sanitaria arriva a casa da sola.
  - Se lasci passare il termine dovrai spiegare il motivo del ritardo, e il Comune lo segnala alla Procura.
ente: Comune (stato civile)
livello_territoriale: nazionale
fonti:
