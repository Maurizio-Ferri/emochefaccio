id: riscatto-laurea
titolo: Riscatto della laurea
tipo: diritto
descrizione: >
  Puoi far contare per la pensione gli anni dell'università, esclusi i fuori corso, pagando un contributo
  all'INPS, anche a rate. Esiste una forma agevolata per i periodi nel sistema contributivo, e possono
  chiederla anche i laureati che non hanno mai lavorato. La domanda si fa online; una volta pagato
  il riscatto non si può revocare.
ente: INPS
livello_territoriale: nazionale
