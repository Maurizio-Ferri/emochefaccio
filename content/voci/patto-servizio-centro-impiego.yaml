id: patto-servizio-centro-impiego
titolo: Patto di servizio con il centro per l'impiego
tipo: dovere
descrizione: >
  La domanda di NASpI vale anche come dichiarazione di disponibilità al lavoro. Dopo devi presentarti
  al centro per l'impiego per firmare il patto di servizio. Se non partecipi alle attività che ti propone,
  l'indennità può essere ridotta o persa.
