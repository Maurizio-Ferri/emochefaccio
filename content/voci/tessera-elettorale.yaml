id: tessera-elettorale
titolo: Tessera elettorale
tipo: diritto
descrizione: >
  Per votare ti serve la tessera elettorale. Se gli spazi sono finiti, se è rovinata o se l'hai persa
  chiedi al Comune una nuova tessera o un duplicato: l'ufficio elettorale resta aperto anche nei giorni
  delle elezioni. Una versione digitale è prevista dalla legge ma non è ancora disponibile.
ente: Comune (ufficio elettorale)
livello_territoriale: nazionale
