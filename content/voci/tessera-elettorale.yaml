id: tessera-elettorale
titolo: Tessera elettorale
tipo: diritto
descrizione: >
  Per votare ti serve la tessera elettorale. Se gli spazi sono finiti o se è rovinata chiedi al Comune
  una nuova tessera; se l'hai persa o te l'hanno rubata chiedi un duplicato portando la denuncia.
  Orari e aperture straordinarie dell'ufficio elettorale nei giorni del voto li trovi sul sito del tuo
  Comune. La legge prevede anche una versione digitale, con regole stabilite dal Ministero
  dell'Interno.
ente: Comune (ufficio elettorale)
livello_territoriale: nazionale
