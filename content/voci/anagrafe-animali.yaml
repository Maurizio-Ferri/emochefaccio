id: anagrafe-animali
titolo: Microchip e anagrafe degli animali da compagnia
tipo: dovere
descrizione: >
  Cani, gatti e furetti devono avere il microchip ed essere registrati all'anagrafe degli animali
  da compagnia. Lo fa il veterinario, privato o della ASL. Il passaggio al nuovo sistema nazionale
  avviene Regione per Regione: verifica cosa vale dove vivi.
ente: Ministero della Salute (tramite veterinario o ASL)
livello_territoriale: regionale
quando: [ha_animale]
fonti:
