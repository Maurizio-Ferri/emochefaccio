id: multe-pagamento-ricorso
titolo: Multa stradale, pagare o fare ricorso
tipo: diritto
descrizione: >
  Se paghi la multa entro un termine paghi l'importo minimo. Se paghi nei primi giorni hai un
  ulteriore sconto, tranne per le infrazioni più gravi. Se pensi che sia sbagliata puoi fare ricorso
  al Prefetto o al giudice di pace, ma solo se non hai pagato. Se la multa toglie punti dalla patente
  e alla guida non c'eri tu, devi comunicare chi guidava: se non lo fai, ricevi un'altra multa.
ente: Organo che ha fatto la multa (Codice della strada)
livello_territoriale: nazionale
