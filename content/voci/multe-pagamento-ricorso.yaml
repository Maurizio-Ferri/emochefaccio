id: multe-pagamento-ricorso
titolo: Multa stradale, pagare o fare ricorso
tipo: diritto
descrizione: >
  Se paghi la multa entro un termine paghi un importo ridotto, ancora più basso se paghi subito.
  Se pensi che sia sbagliata puoi fare ricorso al Prefetto o al giudice, ma solo se non hai pagato.
  Se l'auto è tua ma non guidavi devi comunicare chi era al volante, altrimenti scatta un'altra sanzione.
ente: Organo che ha fatto la multa (Codice della strada)
livello_territoriale: nazionale
