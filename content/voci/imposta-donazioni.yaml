id: imposta-donazioni
titolo: Imposta sulle donazioni
tipo: dovere
descrizione: >
  Una donazione di valore si fa con atto pubblico dal notaio, alla presenza di due testimoni.
  Chi riceve paga l'imposta sulle donazioni solo sulla parte che supera una franchigia, più alta per il coniuge
  e i parenti in linea retta, come figli e genitori, più bassa per fratelli e sorelle, assente per gli altri. Se si donano immobili si pagano anche le imposte ipotecaria
  e catastale. Le imposte le versa il notaio.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
