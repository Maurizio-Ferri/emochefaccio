id: regime-impatriati
titolo: Agevolazione per chi torna a lavorare in Italia
tipo: diritto
descrizione: >
  Se trasferisci la residenza fiscale in Italia dopo un periodo all'estero, sei altamente qualificato
  o hai fatto ricerca sull'intelligenza artificiale e lavori in Italia per la maggior parte dell'anno,
  per alcuni anni paghi le tasse solo su una parte del reddito da lavoro. Paghi ancora meno se arrivi
  con un figlio minore o ne hai uno durante l'agevolazione, e il figlio vive in Italia. Devi
  impegnarti a restare in Italia per un periodo minimo: se te ne vai prima restituisci il beneficio.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
