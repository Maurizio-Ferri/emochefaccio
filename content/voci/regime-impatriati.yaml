id: regime-impatriati
titolo: Agevolazione per chi torna a lavorare in Italia
tipo: diritto
descrizione: >
  Se trasferisci la residenza fiscale in Italia dopo un periodo all'estero e sei altamente qualificato,
  per alcuni anni paghi le tasse solo su una parte del reddito da lavoro, ancora meno se hai figli minori.
  Devi impegnarti a restare in Italia per un periodo minimo: se te ne vai prima restituisci il beneficio.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
