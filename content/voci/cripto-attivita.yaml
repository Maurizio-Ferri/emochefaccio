id: cripto-attivita
titolo: Criptovalute in dichiarazione
tipo: dovere
descrizione: >
  Le cripto-attività vanno indicate nel quadro RW e su di esse si paga un'imposta sul valore,
  se non lo fa già un intermediario. I guadagni quando le vendi o le converti in euro sono tassati
  e vanno dichiarati: conserva i documenti con il prezzo di acquisto, altrimenti vale zero.
  Scambiare una cripto con un'altra simile non conta come guadagno.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
fonti:
