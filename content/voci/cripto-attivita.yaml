id: cripto-attivita
titolo: Criptovalute in dichiarazione
tipo: dovere
descrizione: >
  Se non le tieni presso un intermediario italiano che applica già le imposte, le cripto-attività
  vanno indicate nel quadro RW e su di esse paghi un'imposta sul valore. I guadagni quando le vendi o
  le converti in euro sono tassati e vanno dichiarati: conserva i documenti con il prezzo di acquisto,
  altrimenti vale zero. Scambiare una cripto con un'altra che ha le stesse caratteristiche e funzioni
  non conta come guadagno.
ente: Agenzia delle Entrate
livello_territoriale: nazionale
