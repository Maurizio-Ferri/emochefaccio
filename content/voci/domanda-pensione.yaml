id: domanda-pensione
titolo: Chiedere la pensione
tipo: dovere
descrizione: >
  La pensione non arriva da sola: quando hai i requisiti devi fare domanda all'INPS, online, al contact
  center o tramite patronato. Ci sono diversi tipi, come vecchiaia e anticipata. Se sei dipendente
  devi aver cessato il rapporto di lavoro. I requisiti cambiano nel tempo: verificali sulla fonte.
ente: INPS
livello_territoriale: nazionale
