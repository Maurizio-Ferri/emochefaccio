id: iscrizione-aire
titolo: Iscriversi all'AIRE se vai a vivere all'estero
tipo: dovere
descrizione: >
  Se ti trasferisci all'estero per più di un anno devi iscriverti all'AIRE, l'anagrafe degli italiani
  residenti all'estero, tramite il consolato, anche online con Fast It. Se non lo fai il Comune può darti
  una sanzione. L'iscrizione non basta da sola a cambiare la residenza fiscale: conta anche dove vivi davvero.
ente: Consolato (Ministero degli Esteri) e Comune
livello_territoriale: nazionale
