# Domande della modalità "La mia situazione".
# Ogni id è un flag usato nel campo `quando` delle voci.
domande:
  - id: lavoratore_dipendente
    testo: Lavori come dipendente?
  - id: ha_patente
    testo: Hai la patente di guida?
  - id: possiede_veicolo
    testo: Hai un'auto o una moto intestata a te?
  - id: occupa_immobile
    testo: Vivi in una casa tua, in affitto o di proprietà?
    aiuto: Rispondi no se vivi ancora con i tuoi genitori.
  - id: in_affitto
    testo: Sei in affitto?
    mostra_se: [occupa_immobile]
  - id: proprietario_abitazione
    testo: La casa in cui vivi è di tua proprietà?
    mostra_se: [occupa_immobile]
  - id: ha_mutuo
    testo: Stai pagando un mutuo per quella casa?
    mostra_se: [proprietario_abitazione]
  - id: possiede_altri_immobili
    testo: Possiedi immobili oltre alla casa in cui vivi?
    aiuto: Per esempio una seconda casa, un box o un terreno, anche ereditati o in comproprietà.
  - id: ha_animale
    testo: Hai un cane, un gatto o un altro animale da compagnia?

