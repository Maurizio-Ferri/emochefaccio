name: Controlli

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validazione contenuti
        run: npm run validate
      - name: Test del motore
        run: npm test
      - name: Build
        run: npm run build
